name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o jogo (abre o zip, se houver)
        run: |
          echo "Arquivos no repositorio:"; ls -la
          if [ -f jogo.zip ]; then
            unzip -o jogo.zip
          else
            for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          fi
          if [ ! -f package.json ]; then
            p=$(find . -name package.json -not -path "./node_modules/*" | head -n1)
            if [ -n "$p" ]; then cp -r "$(dirname "$p")"/. .; fi
          fi
          if [ ! -f package.json ]; then
            echo "ERRO: nao achei o jogo. Suba o jogo.zip (ou os arquivos) na raiz do repositorio."
            exit 1
          fi
          ls
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dependencias
        run: npm install
      - name: Montar o jogo em www
        run: |
          mkdir -p www/vendor
          cp index.html core.js world.js sim.js models.js scene3d.js render3d.js main.js www/
          cp node_modules/three/build/three.module.js www/vendor/three.module.js
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Paisagem e tela cheia
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml || true
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roube-el-posei-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Roube el Posei APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
